<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Clientes · RAM Motors</title>
<style>
  /* ============================================================
     CONFIGURACIÓN: pegá acá la misma URL de Firebase que pusiste
     en clientes_tab.py (FIREBASE_URL).
  ============================================================= */
</style>
</head>
<body>
<script>
  const FIREBASE_URL = "https://rammotors-clientes-default-rtdb.firebaseio.com"; // <-- pegar acá también
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #F2F2F2; color: #0A0A0A;
  }
  header {
    background: #0A0A0A; color: #fff; padding: 18px 20px;
    display: flex; align-items: center; gap: 10px;
  }
  header .mark {
    width: 34px; height: 34px; border-radius: 8px; background: #e50000;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  }
  header h1 { font-size: 16px; margin: 0; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #DEDEDE; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 12px; font-weight: 600; color: #5C5C5C; display: block; margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=date], input[type=time] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #D5D5D5;
    background: #F7F7F7; font-size: 15px; font-family: inherit;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pill {
    padding: 8px 14px; border-radius: 999px; border: 1px solid #D5D5D5; background: #F7F7F7;
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .pill.active { background: #0A0A0A; border-color: #0A0A0A; color: #fff; }
  button.primary {
    width: 100%; margin-top: 16px; background: #0A0A0A; color: #fff; border: none;
    border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .status { font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
  .status.ok { color: #2E7D32; }
  .status.err { color: #e50000; }
  .cliente-item { background: #fff; border: 1px solid #DEDEDE; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .cliente-item .nombre { font-weight: 700; }
  .cliente-item .detalle { font-size: 13px; color: #5C5C5C; margin-top: 2px; }
  .item-acciones { display: flex; gap: 8px; margin-top: 10px; }
  .item-acciones button { flex: 1; background: #F7F7F7; border: 1px solid #D5D5D5; color: #2A2A2A;
    font-size: 12.5px; font-weight: 700; padding: 8px; border-radius: 8px; }
  .item-acciones button.danger { color: #e50000; border-color: #F3C6CE; }
  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #5C5C5C; margin: 22px 0 10px; }
  .recordatorio-item { background: #fff; border: 1px solid #DEDEDE; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .recordatorio-item .titulo { font-weight: 700; }
  .recordatorio-item .fecha { font-size: 13px; color: #5C5C5C; margin-top: 2px; }
  .recordatorio-item .fecha.vencido { color: #e50000; font-weight: 600; }
  .recordatorio-item .notas { font-size: 13px; color: #5C5C5C; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .badge.hecho { background: #E5E5E5; color: #5C5C5C; }
  .badge.vencido { background: #FBE1E5; color: #e50000; }
  .badge.pendiente { background: #EDEDED; color: #2A2A2A; }
</style>

<header>
  <div class="mark">AV</div>
  <h1>Clientes · Agenda de Ventas</h1>
</header>

<main>
  <div class="card">
    <label>Nombre del cliente</label>
    <input type="text" id="nombre" placeholder="Nombre" />

    <label>Teléfono</label>
    <input type="text" id="telefono" placeholder="Teléfono" />

    <label>Marcas (separadas por coma)</label>
    <input type="text" id="marcas" placeholder="ej. Toyota, Honda" />

    <label>Modelos (separados por coma)</label>
    <input type="text" id="modelos" placeholder="ej. Corolla, Civic" />

    <label>Combustible</label>
    <div class="pills" id="pills-combustible"></div>

    <label>Transmisión</label>
    <div class="pills" id="pills-transmision"></div>

    <div class="row2">
      <div>
        <label>Precio mínimo</label>
        <input type="number" id="pmin" placeholder="$ mínimo" />
      </div>
      <div>
        <label>Precio máximo</label>
        <input type="number" id="pmax" placeholder="$ máximo" />
      </div>
    </div>

    <div class="row2">
      <div>
        <label>Año mínimo</label>
        <input type="number" id="anioMin" placeholder="ej. 2018" />
      </div>
      <div>
        <label>Año máximo</label>
        <input type="number" id="anioMax" placeholder="ej. 2023" />
      </div>
    </div>

    <label>Kilometraje máximo</label>
    <input type="number" id="kmMax" placeholder="ej. 60000" />

    <label>Notas</label>
    <input type="text" id="notas" placeholder="Color, condiciones, etc." />

    <button class="primary" id="btnAgregarCliente" onclick="agregarCliente()">Agregar cliente</button>
    <div class="status" id="status"></div>
  </div>

  <h2 class="section">Clientes registrados</h2>
  <div id="lista"></div>

  <h2 class="section">Recordatorios</h2>
  <div class="card">
    <label>Título</label>
    <input type="text" id="r_titulo" placeholder="ej. Llamar a Juan Pérez" />

    <div class="row2">
      <div>
        <label>Fecha</label>
        <input type="date" id="r_fecha" />
      </div>
      <div>
        <label>Hora</label>
        <input type="time" id="r_hora" />
      </div>
    </div>

    <label>Notas</label>
    <input type="text" id="r_notas" placeholder="Notas (opcional)" />

    <button class="primary" onclick="agregarRecordatorio()">Agregar recordatorio</button>
    <div class="status" id="status-recordatorio"></div>
  </div>
  <div id="lista-recordatorios"></div>
</main>

<script>
  const COMBUSTIBLES = ["Bencina", "Diésel", "Híbrido", "Eléctrico", "GLP"];
  const TRANSMISIONES = ["Manual", "Automática"];
  let seleccionCombustible = [];
  let seleccionTransmision = [];

  function crearPills(contenedorId, opciones, seleccion) {
    const cont = document.getElementById(contenedorId);
    opciones.forEach((opt) => {
      const btn = document.createElement("div");
      btn.className = "pill";
      btn.textContent = opt;
      btn.onclick = () => {
        const i = seleccion.indexOf(opt);
        if (i >= 0) seleccion.splice(i, 1); else seleccion.push(opt);
        btn.classList.toggle("active");
      };
      cont.appendChild(btn);
    });
  }
  crearPills("pills-combustible", COMBUSTIBLES, seleccionCombustible);
  crearPills("pills-transmision", TRANSMISIONES, seleccionTransmision);

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function mostrarStatus(msg, tipo) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "status " + (tipo || "");
    if (tipo === "ok") setTimeout(() => { el.textContent = ""; }, 3000);
  }

  let clientesActuales = [];
  let edicionClienteId = null;

  async function agregarCliente() {
    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    if (!nombre || !telefono) {
      mostrarStatus("Completa al menos el nombre y el teléfono.", "err");
      return;
    }
    const cliente = {
      id: edicionClienteId || uuid(),
      nombre, telefono,
      marcas: document.getElementById("marcas").value.split(",").map(s => s.trim()).filter(Boolean),
      modelos: document.getElementById("modelos").value.split(",").map(s => s.trim()).filter(Boolean),
      combustible: [...seleccionCombustible],
      transmision: [...seleccionTransmision],
      precio_min: document.getElementById("pmin").value,
      precio_max: document.getElementById("pmax").value,
      anio_min: document.getElementById("anioMin").value,
      anio_max: document.getElementById("anioMax").value,
      km_max: document.getElementById("kmMax").value,
      notas: document.getElementById("notas").value.trim(),
    };
    try {
      const resp = await fetch(`${FIREBASE_URL}/clientes/${cliente.id}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cliente),
      });
      if (!resp.ok) throw new Error("Firebase respondió " + resp.status);
      mostrarStatus(edicionClienteId ? "Cambios guardados ✓" : "Cliente agregado ✓", "ok");
      cancelarEdicionCliente();
      cargarClientes();
    } catch (e) {
      mostrarStatus("No se pudo guardar. Revisa tu conexión o la configuración de Firebase.", "err");
    }
  }

  function limpiarFormulario() {
    ["nombre", "telefono", "marcas", "modelos", "pmin", "pmax", "anioMin", "anioMax", "kmMax", "notas"].forEach(id => {
      document.getElementById(id).value = "";
    });
    seleccionCombustible.length = 0;
    seleccionTransmision.length = 0;
    document.querySelectorAll(".pill.active").forEach(p => p.classList.remove("active"));
  }

  function cancelarEdicionCliente() {
    limpiarFormulario();
    edicionClienteId = null;
    document.getElementById("btnAgregarCliente").textContent = "Agregar cliente";
    const cancelBtn = document.getElementById("btnCancelarEdicionCliente");
    if (cancelBtn) cancelBtn.style.display = "none";
  }

  function editarCliente(id) {
    const c = clientesActuales.find(x => x.id === id);
    if (!c) return;
    edicionClienteId = id;
    document.getElementById("nombre").value = c.nombre || "";
    document.getElementById("telefono").value = c.telefono || "";
    document.getElementById("marcas").value = (c.marcas || []).join(", ");
    document.getElementById("modelos").value = (c.modelos || []).join(", ");
    document.getElementById("pmin").value = c.precio_min || "";
    document.getElementById("pmax").value = c.precio_max || "";
    document.getElementById("anioMin").value = c.anio_min || "";
    document.getElementById("anioMax").value = c.anio_max || "";
    document.getElementById("kmMax").value = c.km_max || "";
    document.getElementById("notas").value = c.notas || "";
    seleccionCombustible.length = 0;
    (c.combustible || []).forEach(v => seleccionCombustible.push(v));
    seleccionTransmision.length = 0;
    (c.transmision || []).forEach(v => seleccionTransmision.push(v));
    document.querySelectorAll("#pills-combustible .pill").forEach(el => el.classList.toggle("active", seleccionCombustible.includes(el.textContent)));
    document.querySelectorAll("#pills-transmision .pill").forEach(el => el.classList.toggle("active", seleccionTransmision.includes(el.textContent)));
    document.getElementById("btnAgregarCliente").textContent = "Guardar cambios";
    let cancelBtn = document.getElementById("btnCancelarEdicionCliente");
    if (!cancelBtn) {
      cancelBtn = document.createElement("button");
      cancelBtn.id = "btnCancelarEdicionCliente";
      cancelBtn.textContent = "Cancelar edición";
      cancelBtn.style.cssText = "width:100%;margin-top:8px;background:none;border:1px solid #D5D5D5;color:#5C5C5C;font-size:13px;font-weight:700;padding:10px;border-radius:8px;";
      cancelBtn.onclick = cancelarEdicionCliente;
      document.getElementById("btnAgregarCliente").insertAdjacentElement("afterend", cancelBtn);
    }
    cancelBtn.style.display = "block";
    document.getElementById("btnAgregarCliente").closest(".card").scrollIntoView({behavior: "smooth", block: "start"});
  }

  async function eliminarCliente(id) {
    if (!confirm("¿Eliminar este cliente?")) return;
    try {
      await fetch(`${FIREBASE_URL}/clientes/${id}.json`, { method: "DELETE" });
      if (edicionClienteId === id) cancelarEdicionCliente();
      cargarClientes();
    } catch (e) {
      alert("No se pudo eliminar. Revisa tu conexión.");
    }
  }

  function mostrarStatusRecordatorio(msg, tipo) {
    const el = document.getElementById("status-recordatorio");
    el.textContent = msg;
    el.className = "status " + (tipo || "");
    if (tipo === "ok") setTimeout(() => { el.textContent = ""; }, 3000);
  }

  async function agregarRecordatorio() {
    const titulo = document.getElementById("r_titulo").value.trim();
    const fecha = document.getElementById("r_fecha").value;
    const hora = document.getElementById("r_hora").value || "09:00";
    if (!titulo || !fecha) {
      mostrarStatusRecordatorio("Completa al menos el título y la fecha.", "err");
      return;
    }
    const recordatorio = {
      id: uuid(),
      titulo,
      fecha_hora: `${fecha}T${hora}:00`,
      notas: document.getElementById("r_notas").value.trim(),
      hecho: false,
      notificado: false,
    };
    try {
      const resp = await fetch(`${FIREBASE_URL}/recordatorios/${recordatorio.id}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(recordatorio),
      });
      if (!resp.ok) throw new Error("Firebase respondió " + resp.status);
      mostrarStatusRecordatorio("Recordatorio agregado ✓", "ok");
      ["r_titulo", "r_fecha", "r_hora", "r_notas"].forEach(id => { document.getElementById(id).value = ""; });
      cargarRecordatorios();
    } catch (e) {
      mostrarStatusRecordatorio("No se pudo guardar. Revisa tu conexión o la configuración de Firebase.", "err");
    }
  }

  async function cargarClientes() {
    const cont = document.getElementById("lista");
    try {
      const resp = await fetch(`${FIREBASE_URL}/clientes.json`);
      const data = await resp.json();
      clientesActuales = data ? Object.values(data) : [];
      if (!clientesActuales.length) {
        cont.innerHTML = '<p style="color:#8A8A8A;font-size:14px;">Aún no hay clientes registrados.</p>';
        return;
      }
      cont.innerHTML = clientesActuales.map(c => `
        <div class="cliente-item">
          <div class="nombre">${c.nombre || ""}</div>
          <div class="detalle">${c.telefono || ""}</div>
          <div class="detalle">
            ${(c.marcas || []).join(", ") || "cualquiera"} · ${(c.modelos || []).join(", ") || "cualquiera"}
            ${(c.combustible || []).length ? " · " + c.combustible.join(", ") : ""}
            ${(c.transmision || []).length ? " · " + c.transmision.join(", ") : ""}
            ${(c.anio_min || c.anio_max) ? " · " + (c.anio_min && c.anio_max ? c.anio_min + "–" + c.anio_max : (c.anio_min ? "desde " + c.anio_min : "hasta " + c.anio_max)) : ""}
            ${c.km_max ? " · hasta " + c.km_max + " km" : ""}
          </div>
          <div class="item-acciones">
            <button onclick="editarCliente('${c.id}')">✏️ Editar</button>
            <button onclick="eliminarCliente('${c.id}')" class="danger">🗑 Eliminar</button>
          </div>
        </div>
      `).join("");
    } catch (e) {
      cont.innerHTML = '<p style="color:#e50000;font-size:14px;">No se pudo cargar la lista. Revisa tu conexión.</p>';
    }
  }

  async function cargarRecordatorios() {
    const cont = document.getElementById("lista-recordatorios");
    try {
      const resp = await fetch(`${FIREBASE_URL}/recordatorios.json`);
      const data = await resp.json();
      let recordatorios = data ? Object.values(data) : [];
      if (!recordatorios.length) {
        cont.innerHTML = '<p style="color:#8A8A8A;font-size:14px;">No hay recordatorios por ahora.</p>';
        return;
      }
      recordatorios.sort((a, b) => (a.fecha_hora || "").localeCompare(b.fecha_hora || ""));
      const ahora = new Date();
      cont.innerHTML = recordatorios.map(r => {
        const dt = r.fecha_hora ? new Date(r.fecha_hora) : null;
        const vencido = dt && !r.hecho && dt < ahora;
        const fechaTexto = dt ? dt.toLocaleDateString("es-CL", { day: "2-digit", month: "short", year: "numeric" }) +
          " · " + dt.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }) : "";
        const estado = r.hecho ? '<span class="badge hecho">Hecho</span>' :
          (vencido ? '<span class="badge vencido">Vencido</span>' : '<span class="badge pendiente">Pendiente</span>');
        return `
          <div class="recordatorio-item">
            <div class="titulo">${r.titulo || ""} ${estado}</div>
            <div class="fecha ${vencido ? "vencido" : ""}">${fechaTexto}</div>
            ${r.notas ? `<div class="notas">${r.notas}</div>` : ""}
          </div>
        `;
      }).join("");
    } catch (e) {
      cont.innerHTML = '<p style="color:#e50000;font-size:14px;">No se pudo cargar la lista. Revisa tu conexión.</p>';
    }
  }

  cargarClientes();
  cargarRecordatorios();
</script>
</body>
</html>
