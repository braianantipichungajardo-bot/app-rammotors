<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RAM Motors · Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --rojo:#e50000;
    --bg:#141414;
    --card:#232323;
    --card2:#2b2b2b;
    --texto:#f2f2f2;
    --texto2:#9a9a9a;
    --borde:#3a3a3a;
    --verde:#4CAF50;
    --naranjo:#FF8C00;
    --azul:#2196F3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100%;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{flex:0 0 auto;background:#1a1a1a;padding:14px 14px 10px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:2px solid var(--rojo);position:sticky;top:0;z-index:5;}
  header h1{margin:0 0 2px;font-size:19px;font-weight:800;letter-spacing:.3px;}
  header .sub{font-size:11.5px;color:var(--texto2);margin-bottom:10px;}

  .buscador{display:flex;gap:8px;margin-bottom:8px;}
  .buscador input{flex:1;background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;color:var(--texto);font-size:15px;outline:none;}
  .buscador input::placeholder{color:var(--texto2);}
  .btn-icon{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:0 12px;color:var(--texto);font-size:16px;display:flex;align-items:center;justify-content:center;}

  .filtros-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .filtros-row::-webkit-scrollbar{display:none;}
  .filtros-row select{background:var(--card);border:1px solid var(--borde);border-radius:20px;padding:7px 10px;color:var(--texto);font-size:12.5px;white-space:nowrap;flex:0 0 auto;max-width:130px;}

  .precio-row{display:flex;gap:8px;margin-top:8px;}
  .precio-row input{width:100%;background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;color:var(--texto);font-size:13px;}
  .precio-row span{color:var(--texto2);align-self:center;font-size:12px;}

  .conteo{font-size:12px;color:var(--texto2);margin-top:8px;}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;}
  #lista.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #lista.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  #lista.grid4 .card .titulo{font-size:12px;}
  #lista.grid4 .card .sub{font-size:10px;}
  #lista.grid4 .card .precio{font-size:12px;}
  #lista.list{display:flex;flex-direction:column;gap:10px;}

  .card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--borde);position:relative;}
  .grid .card .foto{height:110px;}
  .list .card{display:flex;}
  .list .card .foto{width:110px;height:110px;flex:0 0 auto;}
  .card .foto{background:#0e0e0e;position:relative;}
  .card .foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .foto .sinfoto{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;}
  .card .info{padding:8px 10px;flex:1;min-width:0;}
  .card .titulo{font-weight:700;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .sub{font-size:11px;color:var(--texto2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .precio{font-weight:800;font-size:15px;margin-top:6px;}
  .card .precio .contado{color:var(--verde);font-size:12px;font-weight:700;margin-left:6px;}
  .card .pies{font-size:10px;color:#e0a030;margin-top:3px;line-height:1.4;}
  .card .estado-badge{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.55);}
  .card .prop-badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-top:5px;}
  .pub-row{display:flex;gap:5px;margin-top:5px;}
  .pub-dot{width:28px;height:28px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:8.5px;border-radius:8px;font-weight:800;letter-spacing:.2px;}

  .vacio{text-align:center;color:var(--texto2);padding:40px 10px;font-size:13px;}

  /* Detalle */
  #detalle{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;}
  #detalle.abierto{display:flex;}
  #detalle .carrusel{position:relative;background:#000;flex:0 0 auto;height:42vh;overflow:hidden;}
  #detalle .carrusel .foto-actual{width:100%;height:100%;object-fit:contain;background:#000;}
  #detalle .carrusel .sinfoto{color:#555;display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;}
  #detalle .cerrar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;background:rgba(0,0,0,.55);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;z-index:2;}
  #detalle .contador-fotos{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
  #detalle .puntos{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;}
  #detalle .puntos span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);}
  #detalle .puntos span.on{background:#fff;}

  #detalle .cuerpo{flex:1;overflow-y:auto;padding:16px;}
  #detalle h2{margin:0 0 4px;font-size:20px;}
  #detalle .sub{color:var(--texto2);font-size:13px;margin-bottom:12px;}
  #detalle .precio-grande{font-size:26px;font-weight:800;margin:6px 0 14px;}
  #detalle .specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  #detalle .spec{background:var(--card);border-radius:10px;padding:9px 11px;}
  #detalle .spec .label{font-size:10px;color:var(--texto2);text-transform:uppercase;letter-spacing:.5px;}
  #detalle .spec .valor{font-size:14.5px;font-weight:700;margin-top:2px;}
  #detalle .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  #detalle .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;color:#fff;}
  #detalle .pub-row{margin-bottom:8px;}
  #detalle .pub-dot{width:36px;height:36px;font-size:10px;border-radius:9px;}
  #detalle .precio-grande .contado{color:var(--verde);font-size:16px;font-weight:700;margin-left:8px;}

  .btn-accion{display:block;width:100%;background:var(--card);border:1px solid var(--borde);color:var(--texto);
    font-size:14px;font-weight:700;padding:12px;border-radius:12px;margin-bottom:10px;}
  .btn-accion:last-of-type{margin-bottom:16px;}
  .btn-accion:disabled{opacity:.6;}

  /* Modal de texto para publicar */
  #modalTexto{position:fixed;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;
    padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  #modalTexto.abierto{display:flex;}
  #modalTexto .modal-texto-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  #modalTexto .modal-texto-header span{font-weight:800;font-size:16px;}
  #modalTexto .modal-texto-header button{background:rgba(255,255,255,.08);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;}
  #textoPublicacionArea{flex:1;width:100%;background:var(--card);border:1px solid var(--borde);color:var(--texto);
    border-radius:12px;padding:12px;font-size:13.5px;line-height:1.55;resize:none;font-family:inherit;box-sizing:border-box;}
  #btnCopiarTexto{margin-top:12px;margin-bottom:0;background:var(--rojo);border:none;color:#fff;}

  /* Visor de fotos a pantalla completa */
  #visorFoto{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;}
  #visorFoto.abierto{display:flex;}
  #visorFoto img{width:100%;height:100%;object-fit:contain;}
  #visorFoto .cerrarVisor{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;background:rgba(0,0,0,.55);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:19px;z-index:2;}
  #visorFoto .contadorVisor{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:5px 0;}

  ::-webkit-scrollbar{width:0;height:0;}

  /* Navegación inferior: alterna entre Stock y Clientes dentro del mismo link */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1a1a1a;
    border-top:2px solid var(--rojo);padding-bottom:env(safe-area-inset-bottom);z-index:40;}
  .bottom-nav button{flex:1;background:none;border:none;color:var(--texto2);font-size:11px;
    font-weight:700;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .bottom-nav button .ic{font-size:19px;}
  .bottom-nav button.activo{color:var(--rojo);}
  main{padding-bottom:74px;}
  #detalle .cuerpo{padding-bottom:74px;}

  /* Vista de Clientes / Recordatorios (misma página, mismo link) */
  #clientesView{display:none;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:74px;}
  #clientesView.abierto{display:block;}
  #clientesView h1{font-size:19px;margin:4px 0 2px;}
  #clientesView .sub-tabs{display:flex;gap:8px;margin:12px 0;}
  #clientesView .sub-tabs button{flex:1;background:var(--card);border:1px solid var(--borde);
    color:var(--texto2);border-radius:10px;padding:9px;font-size:13px;font-weight:700;}
  #clientesView .sub-tabs button.activo{background:var(--rojo);border-color:var(--rojo);color:#fff;}
  .form-card{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:16px;}
  .form-card label{font-size:11.5px;color:var(--texto2);display:block;margin:10px 0 4px;font-weight:700;}
  .form-card input, .form-card select{width:100%;background:#1a1a1a;border:1px solid var(--borde);
    border-radius:10px;padding:10px 12px;color:var(--texto);font-size:14.5px;font-family:inherit;box-sizing:border-box;}
  .form-row2{display:flex;gap:8px;}
  .form-row2>div{flex:1;}
  .pill-choice{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .pill-choice span{padding:8px 13px;border-radius:999px;border:1px solid var(--borde);
    background:#1a1a1a;color:var(--texto2);font-size:12.5px;}
  .pill-choice span.on{background:var(--rojo);border-color:var(--rojo);color:#fff;}
  .btn-guardar{width:100%;margin-top:14px;background:var(--rojo);border:none;color:#fff;
    font-size:14.5px;font-weight:800;padding:13px;border-radius:12px;}
  .estado-msg{font-size:12.5px;text-align:center;margin-top:8px;min-height:16px;}
  .estado-msg.ok{color:var(--verde);}
  .estado-msg.err{color:var(--rojo);}
  .item-card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .item-card .nom{font-weight:700;font-size:14px;}
  .item-card .det{font-size:12.5px;color:var(--texto2);margin-top:2px;}
  .item-card .det.venc{color:var(--rojo);font-weight:700;}
  .item-acciones{display:flex;gap:8px;margin-top:8px;}
  .item-acciones button{flex:1;background:#1a1a1a;border:1px solid var(--borde);color:var(--texto);
    font-size:12px;font-weight:700;padding:8px;border-radius:9px;}
  .item-acciones button.danger{color:var(--rojo);border-color:rgba(229,0,0,.35);}
  .chip-estado{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;}
  .chip-estado.hecho{background:#333;color:#aaa;}
  .chip-estado.vencido{background:rgba(229,0,0,.18);color:var(--rojo);}
  .chip-estado.pendiente{background:rgba(255,255,255,.08);color:var(--texto);}
  .section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--texto2);margin:18px 0 8px;font-weight:700;}

  #calendarioView{display:none;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:74px;}
  #calendarioView.abierto{display:block;}
  #calendarioView h1{font-size:19px;margin:4px 0 2px;}
  .btn-icon-cal{width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid var(--borde);color:#fff;font-size:16px;}
  .dia-cal-app{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;color:#c5c5c5;font-size:12px;background:#1a1a1a;position:relative;}
  .dia-cal-app.otro-mes{color:#444;}
  .dia-cal-app.hoy{background:var(--rojo);color:#fff;font-weight:700;}
  .dia-cal-app.seleccionado{outline:2px solid var(--rojo);}
  .dia-cal-app .punto{width:4px;height:4px;border-radius:50%;margin-top:2px;}
  .recordatorio-card-app{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .recordatorio-card-app .fila-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .recordatorio-card-app .titulo-rec{color:#fff;font-size:13px;font-weight:600;}
  .badge-rec{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .badge-rec.vencido{background:rgba(229,0,0,.18);color:var(--rojo);}
  .badge-rec.pendiente{background:rgba(99,153,34,.18);color:#97c459;}
  .badge-rec.hecho{background:#333;color:#aaa;}

  /* Login: bloquea el acceso hasta iniciar sesión */
  #loginOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;
    align-items:center;justify-content:center;padding:20px;}
  #loginOverlay .caja{width:100%;max-width:340px;background:var(--card);border:1px solid var(--borde);
    border-radius:16px;padding:26px 22px;}
  #loginOverlay .marca{width:52px;height:52px;border-radius:14px;background:var(--rojo);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;margin:0 auto 14px;}
  #loginOverlay h1{color:#fff;font-size:17px;text-align:center;margin:0 0 20px;}
  #loginOverlay label{color:var(--texto2);font-size:12px;font-weight:700;display:block;margin:12px 0 4px;}
  #loginOverlay input{width:100%;background:#0a0a0a;border:1px solid var(--borde);border-radius:9px;
    padding:11px 12px;color:#fff;font-size:14.5px;box-sizing:border-box;}
  #loginOverlay input:focus{outline:none;border-color:var(--rojo);}
  #loginOverlay button{width:100%;margin-top:18px;background:var(--rojo);border:none;color:#fff;
    font-weight:700;font-size:14.5px;padding:12px;border-radius:9px;}
  #loginOverlay .error{color:var(--rojo);font-size:12.5px;text-align:center;margin-top:10px;min-height:16px;}
  #modalCotizacionApp input{background:#0a0a0a;border:1px solid var(--borde);border-radius:8px;color:#fff;
    padding:8px 10px;font-size:13px;box-sizing:border-box;}
  #modalCotizacionApp input:focus{outline:none;border-color:var(--rojo);}
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="caja">
    <div class="marca">AV</div>
    <h1>Iniciar sesión</h1>
    <label>Usuario</label>
    <input type="email" id="loginEmail" placeholder="usuario@rammotors.cl" autocomplete="username" />
    <label>Contraseña</label>
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" />
    <button id="btnLogin">Entrar</button>
    <button id="btnInvitado" style="background:none;border:1px solid var(--borde);color:var(--texto2);
      margin-top:10px;">Entrar como cliente</button>
    <div class="error" id="loginError"></div>
  </div>
</div>
<div id="app">
  <header>
    <button id="btnCambiarAcceso" title="Cambiar acceso" style="display:none;position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;
      background:#262626;border:1px solid #333;color:var(--texto2);font-size:11.5px;font-weight:600;
      padding:6px 11px;border-radius:8px;z-index:6;">↩ Cambiar acceso</button>
    <h1>RAM Motors <span style="color:var(--rojo)">·</span> Stock</h1>
    <div class="sub" id="fechaGenerado">Actualizado: —</div>
    <div class="buscador">
      <input id="buscar" type="search" placeholder="Buscar marca, modelo, patente...">
      <button class="btn-icon" id="btnVista" title="Cambiar vista">▦</button>
    </div>
    <div class="filtros-row">
      <select id="fMarca"><option value="">Marca: Todas</option></select>
      <select id="fCombustible"><option value="">Combustible: Todos</option></select>
      <select id="fTransmision"><option value="">Transmisión: Todas</option></select>
      <select id="fPropiedad">
        <option value="">Propiedad: Todas</option>
        <option value="propio">Propio</option>
        <option value="consignado">Consignado</option>
        <option value="consignado_virtual">Consignado Virtual</option>
      </select>
      <select id="fOrigen">
        <option value="">Origen: Todos</option>
        <option value="China">China</option>
        <option value="Tradicional">Tradicional</option>
      </select>
      <select id="fOrden">
        <option value="precio_asc">Precio: menor a mayor</option>
        <option value="precio_desc">Precio: mayor a menor</option>
        <option value="alfabetico">Alfabético (A-Z)</option>
        <option value="km_asc">Kilometraje: menor a mayor</option>
        <option value="dias_desc">Más nuevos primero</option>
      </select>
      <button id="btnLimpiarFiltrosApp" style="background:var(--card);border:1px solid var(--borde);border-radius:20px;
        padding:7px 12px;color:var(--texto);font-size:12.5px;white-space:nowrap;flex:0 0 auto;">✕ Limpiar filtros</button>
      <button id="btnCatalogoApp" style="display:none;background:var(--rojo);border:1px solid var(--rojo);border-radius:20px;
        padding:7px 12px;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto;">📄 Catálogo</button>
    </div>
    <div class="precio-row">
      <input id="precioMin" type="number" inputmode="numeric" placeholder="Precio mín.">
      <span>—</span>
      <input id="precioMax" type="number" inputmode="numeric" placeholder="Precio máx.">
    </div>
    <div class="conteo" id="conteo"></div>
  </header>

  <main>
    <div id="lista" class="list"></div>
  </main>
</div>

<div id="detalle">
  <div class="carrusel" id="carrusel">
    <button class="cerrar" id="btnCerrar">✕</button>
    <div id="fotoWrap"></div>
    <div class="contador-fotos" id="contadorFotos"></div>
    <div class="puntos" id="puntos"></div>
  </div>
  <div class="cuerpo">
    <h2 id="dTitulo"></h2>
    <div class="sub" id="dSub"></div>
    <div class="badges" id="dBadges"></div>
    <div class="pub-row" id="dPublicado"></div>
    <div class="precio-grande" id="dPrecio"></div>
    <div class="specs" id="dSpecs"></div>
    <button class="btn-accion" id="btnVerTexto">📝 Ver texto para publicar</button>
    <button class="btn-accion" id="btnDescargarImagenIG">📷 Descargar imagen para Instagram</button>
    <button class="btn-accion" id="btnConsultarWhatsapp" style="background:#25D366;color:#0a0a0a;font-weight:800;">💬 Consultar por este vehículo</button>
    <button class="btn-accion" id="btnCotizarApp" style="background:var(--rojo);color:#fff;font-weight:800;">📄 Generar cotización</button>
    <button class="btn-accion" id="btnDescargarFotos">⬇ Descargar todas las fotos</button>
  </div>
</div>

<div id="visorFoto">
  <button class="cerrarVisor" id="btnCerrarVisor">✕</button>
  <img id="imgVisor" src="">
  <div class="contadorVisor" id="contadorVisor"></div>
</div>

<div id="modalTexto">
  <div class="modal-texto-header">
    <span>Texto para publicar</span>
    <button id="btnCerrarTexto">✕</button>
  </div>
  <textarea id="textoPublicacionArea" readonly></textarea>

function fmtPrecio(n){
  n = Math.round(Number(n)||0);
  return "$" + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function fmtKm(n){
  n = Math.round(Number(n)||0);
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " km";
}

function poblarSelect(id, valores){
  const sel = document.getElementById(id);
  const guardado = sel.value;
  [...new Set(valores.filter(v => v && String(v).trim() !== ""))].sort().forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

function initFiltros(){
  poblarSelect('fMarca', vehiculos.map(v=>v.marca));
  poblarSelect('fCombustible', vehiculos.map(v=>v.combustible));
  poblarSelect('fTransmision', vehiculos.map(v=>v.transmision));
}

function aplicarFiltros(){
  const texto = document.getElementById('buscar').value.trim().toUpperCase();
  const marca = document.getElementById('fMarca').value;
  const combustible = document.getElementById('fCombustible').value;
  const transmision = document.getElementById('fTransmision').value;
  const propiedad = document.getElementById('fPropiedad').value;
  const origen = document.getElementById('fOrigen').value;
  const orden = document.getElementById('fOrden').value;
  const pMin = parseFloat(document.getElementById('precioMin').value) || 0;
  const pMax = parseFloat(document.getElementById('precioMax').value) || Infinity;

  let out = vehiculos.filter(v=>{
    if (texto){
      const hay = `${v.marca} ${v.modelo} ${v.version} ${v.patente}`.toUpperCase();
      if (!hay.includes(texto)) return false;
    }
    if (marca && v.marca !== marca) return false;
    if (combustible && v.combustible !== combustible) return false;
    if (transmision && v.transmision !== transmision) return false;
    if (propiedad && v.propiedad !== propiedad) return false;
    if (origen && v.origen !== origen) return false;
    const precio = Number(v.precio)||0;
    if (precio < pMin || precio > pMax) return false;
    return true;
  });

  out.sort((a,b)=>{
    if (orden === 'precio_asc') return (Number(a.precio)||0) - (Number(b.precio)||0);
    if (orden === 'precio_desc') return (Number(b.precio)||0) - (Number(a.precio)||0);
    if (orden === 'km_asc') return (Number(a.km)||0) - (Number(b.km)||0);
    if (orden === 'dias_desc') return (Number(a.dias_stock)||0) - (Number(b.dias_stock)||0);
    if (orden === 'alfabetico') return `${a.marca} ${a.modelo}`.localeCompare(`${b.marca} ${b.modelo}`);
    return 0;
  });

  document.getElementById('conteo').textContent = `${out.length} vehículo${out.length===1?'':'s'} encontrado${out.length===1?'':'s'}`;
  renderLista(out);
  guardarPrefs();
}

function badgePropiedad(v){
  if (v.propiedad === 'propio') return `<span class="prop-badge" style="background:#4CAF5033;color:#4CAF50;">Propio</span>`;
  if (v.propiedad === 'consignado') return `<span class="prop-badge" style="background:#FF980033;color:#FF9800;">Consignado</span>`;
  if (v.propiedad === 'consignado_virtual') return `<span class="prop-badge" style="background:#00BCD433;color:#00BCD4;">Consignado Virtual</span>`;
  return '';
}

function filaPublicado(v){
  // Las casillas MKT/IG/FB se ocultaron a pedido: la app iPhone ya no las muestra
  // (ni en las tarjetas de la lista ni en el detalle del vehículo).
  return '';
}

function lineaContado(v){
  if (!v.precio_contado) return '';
  return `<span class="contado">· Contado ${fmtPrecio(v.precio_contado)}</span>`;
}

function lineaPies(v){
  if (v.pie_minimo == null && v.pie_instantaneo == null) return '';
  const partes = [];
  if (v.pie_minimo != null) partes.push(`Pie mínimo para evaluar: ${fmtPrecio(v.pie_minimo)}`);
  if (v.pie_instantaneo != null) partes.push(`Pie para instantáneo: ${fmtPrecio(v.pie_instantaneo)}`);
  return `<div class="pies">${partes.join(' · ')}</div>`;
}

function renderLista(out){
  const cont = document.getElementById('lista');
  cont.className = vista;
  if (!out.length){
    cont.innerHTML = `<div class="vacio">No hay vehículos que coincidan con la búsqueda.</div>`;
    return;
  }
  cont.innerHTML = out.map((v, i)=>{
    const foto = (v.fotos && v.fotos[0]) ? `<img src="${v.fotos[0]}" loading="lazy">` : `<div class="sinfoto">Sin foto</div>`;
    const colorEstado = v.reservado ? COLOR_RESERVADO : (ESTADO_COLOR[v.estado] || '#4CAF50');
    const textoEstado = v.reservado ? 'Reservado' : (v.estado || '');
    return `<div class="card" data-idx="${vehiculos.indexOf(v)}">
      <div class="foto">${foto}<span class="estado-badge" style="color:${colorEstado}">${textoEstado}</span></div>
      <div class="info">
        <div class="titulo">${v.marca||''} ${v.modelo||''} ${v.version||''}</div>
        <div class="sub">Patente: ${v.patente||'-'} · Año: ${v.anio||'-'}</div>
        <div class="sub">${fmtKm(v.km)} · ${v.combustible||'-'} · ${v.transmision||'-'}</div>
        <div class="precio">${fmtPrecio(v.precio)} ${lineaContado(v)}</div>
        ${lineaPies(v)}
        ${badgePropiedad(v)}
        ${filaPublicado(v)}
      </div>
    </div>`;
  }).join('');

  [...cont.querySelectorAll('.card')].forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalle(vehiculos[Number(el.dataset.idx)]));
  });
}

function guardarPrefs(){
  localStorage.setItem('ram_prefs', JSON.stringify({
    buscar: document.getElementById('buscar').value,
    fMarca: document.getElementById('fMarca').value,
    fCombustible: document.getElementById('fCombustible').value,
    fTransmision: document.getElementById('fTransmision').value,
    fPropiedad: document.getElementById('fPropiedad').value,
    fOrigen: document.getElementById('fOrigen').value,
    fOrden: document.getElementById('fOrden').value,
    precioMin: document.getElementById('precioMin').value,
    precioMax: document.getElementById('precioMax').value,
  }));
}
function restaurarPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('ram_prefs')||'{}');
    if (p.buscar) document.getElementById('buscar').value = p.buscar;
    if (p.fMarca) document.getElementById('fMarca').value = p.fMarca;
    if (p.fCombustible) document.getElementById('fCombustible').value = p.fCombustible;
    if (p.fTransmision) document.getElementById('fTransmision').value = p.fTransmision;
    if (p.fPropiedad) document.getElementById('fPropiedad').value = p.fPropiedad;
    if (p.fOrigen) document.getElementById('fOrigen').value = p.fOrigen;
    if (p.fOrden) document.getElementById('fOrden').value = p.fOrden;
    if (p.precioMin) document.getElementById('precioMin').value = p.precioMin;
    if (p.precioMax) document.getElementById('precioMax').value = p.precioMax;
  }catch(e){}
}

// --- Descargar todas las fotos del vehículo ---
// En iPhone/iPad se comparten como fotos sueltas (Safari no tiene límite de cantidad).
// En Android (y el resto) se arma un solo .zip, porque Chrome limita a 10 archivos
// por vez al usar navigator.share() con varios archivos sueltos.
function esIOS(){
  const ua = navigator.userAgent || '';
  const esIPhoneClasico = /iPhone|iPad|iPod/.test(ua);
  const esIPadModoEscritorio = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  return esIPhoneClasico || esIPadModoEscritorio;
}

async function obtenerArchivoFoto(url, nombre){
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} en ${url}`);
  const blob = await resp.blob();
  return new File([blob], nombre, {type: blob.type || 'image/jpeg'});
}

async function obtenerBlobFoto(url){
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} en ${url}`);
  return await resp.blob();
}

function descargarArchivoLocal(file){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 30000);
}

async function compartirOdescargar(archivos, titulo){
  let compartido = false;
  if (navigator.canShare && navigator.canShare({files: archivos})){
    try{
      await navigator.share({files: archivos, title: titulo});
      compartido = true;
    }catch(eShare){
      if (eShare && eShare.name === 'AbortError'){
        // El usuario cerró el cuadro de compartir: no es un error, no hacemos nada más.
        compartido = true;
      }
      // Si share() falla por otro motivo, seguimos abajo con la descarga directa como respaldo.
    }
  }
  if (!compartido){
    archivos.forEach(descargarArchivoLocal);
  }
}

document.getElementById('btnDescargarFotos').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnDescargarFotos');
  if (!detalleActual || !detalleActual.fotos || !detalleActual.fotos.length){
    alert('Este vehículo no tiene fotos.');
    return;
  }
  const textoOriginal = btn.textContent;
  btn.textContent = 'Preparando fotos...';
  btn.disabled = true;
  const titulo = `${detalleActual.marca||''} ${detalleActual.modelo||''}`.trim();
  try{
    if (esIOS()){
      // --- iPhone/iPad: comportamiento de siempre, fotos sueltas ---
      // Se piden todas en paralelo (no una por una) para no demorar la respuesta:
      // si pasa mucho tiempo entre el toque del botón y navigator.share(),
      // Safari puede rechazar el share por "falta de gesto del usuario".
      const resultados = await Promise.allSettled(
        detalleActual.fotos.map((url, i) => obtenerArchivoFoto(url, `foto_${i + 1}.jpg`))
      );
      const archivos = resultados.filter(r => r.status === 'fulfilled').map(r => r.value);
      const fallidas = resultados.length - archivos.length;

      if (!archivos.length){
        alert('No se pudo descargar ninguna foto. Revisá tu conexión e intentá de nuevo.');
        return;
      }
      await compartirOdescargar(archivos, titulo);
      if (fallidas > 0){
        alert(`Se descargaron ${archivos.length} de ${detalleActual.fotos.length} fotos. ${fallidas} no se pudieron traer.`);
      }
    } else {
      // --- Android y el resto: se arma un solo .zip para evitar el límite de 10 archivos ---
      const resultados = await Promise.allSettled(
        detalleActual.fotos.map((url) => obtenerBlobFoto(url))
      );
      const blobs = resultados.map((r, i) => r.status === 'fulfilled' ? {i, blob: r.value} : null).filter(Boolean);
      const fallidas = resultados.length - blobs.length;

      if (!blobs.length){
        alert('No se pudo descargar ninguna foto. Revisá tu conexión e intentá de nuevo.');
        return;
      }
      const zip = new JSZip();
      blobs.forEach(({i, blob}) => {
        const ext = (blob.type && blob.type.includes('png')) ? 'png' : 'jpg';
        zip.file(`foto_${i + 1}.${ext}`, blob);
      });
      const nombreBase = titulo.replace(/\s+/g, '_') || 'fotos';
      const zipBlob = await zip.generateAsync({type: 'blob'});
      const zipFile = new File([zipBlob], `${nombreBase}.zip`, {type: 'application/zip'});
      await compartirOdescargar([zipFile], titulo);
      if (fallidas > 0){
        alert(`Se incluyeron ${blobs.length} de ${detalleActual.fotos.length} fotos en el .zip. ${fallidas} no se pudieron traer.`);
      }
    }
  }catch(e){
    alert('No se pudieron descargar las fotos: ' + (e && e.message ? e.message : e));
  }finally{
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }
});

      cont.innerHTML = '<p style="color:var(--texto2);font-size:13px;">Todavía no hay clientes cotizados.</p>';
      return;
    }
    cont.innerHTML = clientesCotizadosActualesApp.map(c => `
      <div class="item-card">
        <div class="nom">${c.nombre||''}</div>
        <div class="det">${c.telefono||''}${c.email? ' · '+c.email : ''}</div>
        ${c.direccion? `<div class="det">${c.direccion}</div>` : ''}
        ${c.notas? `<div class="det">${c.notas}</div>` : ''}
        <div class="item-acciones">
          <button onclick="editarClienteCotizadoApp('${c.id}')">✏️ Editar</button>
          <button onclick="eliminarClienteCotizadoApp('${c.id}')" class="danger">🗑 Eliminar</button>
        </div>
      </div>
    `).join('');
  }catch(e){
    cont.innerHTML = '<p style="color:var(--rojo);font-size:13px;">No se pudo cargar la lista.</p>';
  }
}

// =====================================================
// CALENDARIO DE RECORDATORIOS
// =====================================================
let mesCalAppActual = new Date().getMonth();
let anioCalAppActual = new Date().getFullYear();
let diaCalAppSeleccionado = new Date().toISOString().slice(0, 10);
let recordatoriosCalApp = [];
const MESES_CAL_APP = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function cargarRecordatoriosCalApp(){
  if (!document.getElementById('recAppFecha').value){
    document.getElementById('recAppFecha').value = diaCalAppSeleccionado;
  }
  try{
    const resp = await fetch(await urlFirebaseApp('/recordatorios.json'));
    const data = await resp.json();
    recordatoriosCalApp = data ? Object.values(data) : [];
  }catch(e){
    recordatoriosCalApp = [];
  }
  renderizarCalendarioApp();
}

function recordatoriosDelDiaApp(fechaISO){
  return recordatoriosCalApp.filter(r => (r.fecha_hora || '').slice(0, 10) === fechaISO);
}

function estadoRecordatorioApp(r){
  if (r.hecho) return 'hecho';
  const vencido = r.fecha_hora && new Date(r.fecha_hora) < new Date();
  return vencido ? 'vencido' : 'pendiente';
}

function renderizarCalendarioApp(){
  document.getElementById('tituloMesCalApp').textContent = `${MESES_CAL_APP[mesCalAppActual]} ${anioCalAppActual}`;
  const grid = document.getElementById('gridCalendarioApp');
  grid.innerHTML = '';
  const primerDia = new Date(anioCalAppActual, mesCalAppActual, 1);
  let offset = primerDia.getDay() - 1;
  if (offset < 0) offset = 6;
  const diasEnMes = new Date(anioCalAppActual, mesCalAppActual + 1, 0).getDate();
  const hoyISO = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < offset; i++){
    grid.appendChild(document.createElement('div'));
  }
  for (let dia = 1; dia <= diasEnMes; dia++){
    const fechaISO = `${anioCalAppActual}-${String(mesCalAppActual+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const celda = document.createElement('div');
    celda.className = 'dia-cal-app' + (fechaISO === hoyISO ? ' hoy' : '') + (fechaISO === diaCalAppSeleccionado ? ' seleccionado' : '');
    celda.innerHTML = `<span>${dia}</span>`;
    const delDia = recordatoriosDelDiaApp(fechaISO).filter(r => !r.hecho);
    if (delDia.length){
      const hayVencido = delDia.some(r => estadoRecordatorioApp(r) === 'vencido');
      const punto = document.createElement('div');
      punto.className = 'punto';
      punto.style.background = hayVencido ? 'var(--rojo)' : '#97c459';
      celda.appendChild(punto);
    }
    celda.addEventListener('click', () => {
      diaCalAppSeleccionado = fechaISO;
      document.getElementById('recAppFecha').value = fechaISO;
      renderizarCalendarioApp();
    });
    grid.appendChild(celda);
  }
  renderizarListaDiaApp();
}

function renderizarListaDiaApp(){
  const [y, m, d] = diaCalAppSeleccionado.split('-');
  document.getElementById('tituloDiaCalApp').textContent = `${d} de ${MESES_CAL_APP[Number(m)-1]}`;
  const cont = document.getElementById('listaDiaCalApp');
  const items = recordatoriosDelDiaApp(diaCalAppSeleccionado);
  if (!items.length){
    cont.innerHTML = '<p style="color:var(--texto2);font-size:13px;">No hay recordatorios este día.</p>';
    return;
  }
  items.sort((a,b) => (a.fecha_hora||'').localeCompare(b.fecha_hora||''));
  cont.innerHTML = items.map(r => {
    const hora = r.fecha_hora ? r.fecha_hora.slice(11,16) : '';
    const estado = estadoRecordatorioApp(r);
    const etiqueta = estado === 'vencido' ? 'Vencido' : (estado === 'hecho' ? 'Hecho' : 'Pendiente');
    return `
      <div class="recordatorio-card-app">
        <div class="fila-top">
          <span class="titulo-rec">${r.titulo||''}</span>
          <span class="badge-rec ${estado}">${etiqueta}</span>
        </div>
        <div style="color:var(--texto2);font-size:11.5px;margin-top:3px;">${hora}${r.notas ? ' · ' + r.notas : ''}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
          <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--texto2);">
            <input type="checkbox" data-rec-id-app="${r.id}" ${r.hecho ? 'checked' : ''}> Marcar como hecho
          </label>
          <button data-rec-borrar-app="${r.id}" style="background:none;border:none;color:var(--rojo);font-size:11.5px;">🗑 Eliminar</button>
        </div>
      </div>
    `;
  }).join('');
  cont.querySelectorAll('input[data-rec-id-app]').forEach(chk => {
    chk.addEventListener('change', async (e) => {
      const r = recordatoriosCalApp.find(x => x.id === e.target.dataset.recIdApp);
      if (!r) return;
      r.hecho = e.target.checked;
      try{
        await fetch(await urlFirebaseApp(`/recordatorios/${r.id}.json`), {
          method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(r),
        });
      }catch(err){}
      renderizarCalendarioApp();
    });
  });
  cont.querySelectorAll('button[data-rec-borrar-app]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('¿Eliminar este recordatorio?')) return;
      try{
        await fetch(await urlFirebaseApp(`/recordatorios/${e.target.dataset.recBorrarApp}.json`), {method:'DELETE'});
      }catch(err){}
      await cargarRecordatoriosCalApp();
    });
  });
}

async function guardarNuevoRecordatorioApp(){
  const titulo = document.getElementById('recAppTitulo').value.trim();
  const fecha = document.getElementById('recAppFecha').value;
  const hora = document.getElementById('recAppHora').value || '09:00';
  if (!titulo || !fecha){
    mostrarEstadoApp('recAppEstado', 'Completa al menos el título y la fecha.', 'err');
    return;
  }
  const recordatorio = {
    id: uuidApp(), titulo, fecha_hora: `${fecha}T${hora}:00`,
    notas: document.getElementById('recAppNotas').value.trim(), hecho: false, notificado: false,
  };
  try{
    const resp = await fetch(await urlFirebaseApp(`/recordatorios/${recordatorio.id}.json`), {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(recordatorio),
    });
    if (!resp.ok) throw new Error('Firebase respondió ' + resp.status);
    mostrarEstadoApp('recAppEstado', 'Recordatorio agregado ✓', 'ok');
    document.getElementById('recAppTitulo').value = '';
    document.getElementById('recAppNotas').value = '';
    diaCalAppSeleccionado = fecha;
    await cargarRecordatoriosCalApp();
  }catch(e){
    mostrarEstadoApp('recAppEstado', 'No se pudo guardar. Revisá tu conexión.', 'err');
  }
}

document.getElementById('btnMesAnteriorApp').addEventListener('click', () => {
  mesCalAppActual--;
  if (mesCalAppActual < 0){ mesCalAppActual = 11; anioCalAppActual--; }
  renderizarCalendarioApp();
});
document.getElementById('btnMesSiguienteApp').addEventListener('click', () => {
  mesCalAppActual++;
  if (mesCalAppActual > 11){ mesCalAppActual = 0; anioCalAppActual++; }
  renderizarCalendarioApp();
});

// Service Worker: guarda esta página en el teléfono para que abra sin internet
// una vez que se cargó al menos una vez con conexión.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
